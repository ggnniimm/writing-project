<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 50px;
        }
        .timeline-container {
            position: relative;
            width: 900px;
            height: 400px;
            /* border: 1px solid #eee; */
        }
        /* Main Line */
        .line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
        }
        .arrow {
            position: absolute;
            top: 50%;
            right: -10px;
            width: 0; 
            height: 0; 
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid #333;
            transform: translateY(-50%);
        }

        /* Points */
        .point {
            position: absolute;
            top: 50%;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .p-green { background-color: #4CAF50; border: 2px solid white; box-shadow: 0 0 0 2px #4CAF50; }
        .p-purple { background-color: #9C27B0; border: 2px solid white; box-shadow: 0 0 0 2px #9C27B0; }
        .p-red { background-color: #F44336; border: 2px solid white; box-shadow: 0 0 0 2px #F44336; }
        .p-blue { background-color: #2196F3; border: 2px solid white; box-shadow: 0 0 0 2px #2196F3; }
        .p-black { background-color: #000; border: 2px solid white; box-shadow: 0 0 0 2px #000; }

        /* Labels */
        .label {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }
        .date {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            font-weight: normal;
        }
        
        /* Specific Positions (approximate %) */
        /* Total Span: Aug 47 to Sep 48 ~ 13 months */
        /* Start 27 Aug 47 = 0% */
        /* Req Perm 22 Dec 47 ~ 30% */
        /* End Contract 24 Dec 47 ~ 31% */
        /* Perm Granted 28 Apr 48 ~ 62% */
        /* Completed 29 Sep 48 ~ 100% */
        
        .pos-1 { left: 5%; }   /* Start 27 Aug */
        .pos-2 { left: 35%; }  /* Req 22 Dec */
        .pos-3 { left: 40%; }  /* End 24 Dec (shifted slightly right for visibility) */
        .pos-4 { left: 65%; }  /* Perm 28 Apr */
        .pos-5 { left: 95%; }  /* Done 29 Sep */

        /* Label Positioning */
        .top-label { bottom: 30px; transform: translateX(-50%); text-align: center; }
        .bottom-date { top: 20px; transform: translateX(-50%); text-align: center; }
        
        /* Connectors */
        .connector-up {
            position: absolute;
            bottom: 50%;
            width: 2px;
            height: 25px;
            background-color: #ddd;
            transform: translateX(-50%);
            left: 50%;
        }
        .connector-down {
            position: absolute;
            top: 50%;
            width: 2px;
            height: 25px;
            background-color: #ddd;
            transform: translateX(-50%);
            left: 50%;
        }

        /* Duration Brackets */
        .bracket-container {
            position: absolute;
            top: 60%;
            height: 40px;
        }
        .bracket-line {
            border-bottom: 2px dashed #999;
            border-left: 2px solid #999;
            border-right: 2px solid #999;
            height: 10px;
            width: 100%;
            position: absolute;
            bottom: 0;
        }
        .bracket-text {
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #555;
            position: absolute;
            bottom: -20px;
        }

    </style>
</head>
<body>
    <div class="timeline-container">
        <div class="line"></div>
        <div class="arrow"></div>

        <!-- 1. Start Contract -->
        <div class="point p-green pos-1">
            <div class="label top-label" style="color: #4CAF50;">เริ่มสัญญา<div class="connector-up" style="background-color: #4CAF50;"></div></div>
            <div class="label bottom-date" style="color:#4CAF50;">27 ส.ค. 47<br></div>
        </div>

        <!-- 2. Request -->
        <div class="point p-purple pos-2">
            <div class="label top-label" style="bottom: 50px; color: #9C27B0;">ขออนุญาต<div class="connector-up" style="height:45px; background-color: #9C27B0;"></div></div>
            <div class="label bottom-date" style="top: 40px; color: #9C27B0;">22 ธ.ค. 47<br></div>
        </div>

        <!-- 3. Contract End -->
        <div class="point p-red pos-3">
            <div class="label top-label" style="color: #F44336;">ครบสัญญา<div class="connector-up" style="background-color: #F44336;"></div></div>
            <div class="label bottom-date" style="color: #F44336;">24 ธ.ค. 47<br></div>
        </div>

        <!-- 4. Permission -->
        <div class="point p-purple pos-4">
            <div class="label top-label" style="color: #9C27B0;">ได้รับอนุญาต<div class="connector-up" style="background-color: #9C27B0;"></div></div>
            <div class="label bottom-date" style="color: #9C27B0;">28 เม.ย. 48<br></div>
        </div>

        <!-- 5. Completed -->
        <div class="point p-black pos-5">
            <div class="label top-label">งานแล้วเสร็จ<div class="connector-up" style="background-color: #000;"></div></div>
            <div class="label bottom-date">29 ก.ย. 48<br></div>
        </div>

        <!-- Duration 1: Exempt -->
        <div class="bracket-container" style="left: 40%; width: 25%;">
            <div class="bracket-line" style="border-bottom: 2px solid #888;"></div>
            <div class="bracket-text">งดค่าปรับ 125 วัน<br>(รอใบอนุญาต)</div>
        </div>

        <!-- Duration 2: Fine -->
        <div class="bracket-container" style="left: 65%; width: 30%;">
             <div class="bracket-line" style="border-bottom: 2px dotted #F44336; border-color: #F44336;"></div>
            <div class="bracket-text" style="color: #F44336;">ปรับล่าช้า<br>(ช่วงทำงานจริง)</div>
        </div>

    </div>
</body>
</html>
